basePath: /
definitions:
  admin-server_internal_model.ChunkStatusResp:
    properties:
      uploadedChunks:
        items:
          type: integer
        type: array
    type: object
  admin-server_internal_model.CreateFolderReq:
    properties:
      name:
        maxLength: 100
        minLength: 1
        type: string
      parentId:
        type: integer
    required:
    - name
    type: object
  admin-server_internal_model.CreateUserReq:
    properties:
      avatar:
        type: string
      email:
        type: string
      nickname:
        type: string
      password:
        minLength: 6
        type: string
      phone:
        type: string
      roles:
        type: string
      status:
        type: integer
      username:
        maxLength: 50
        minLength: 3
        type: string
    required:
    - password
    - username
    type: object
  admin-server_internal_model.FileFolder:
    properties:
      createdAt:
        type: string
      createdBy:
        type: integer
      id:
        type: integer
      name:
        type: string
      parentId:
        type: integer
      updatedAt:
        type: string
    type: object
  admin-server_internal_model.FileRecord:
    properties:
      createdAt:
        type: string
      folderId:
        type: integer
      id:
        type: integer
      mimeType:
        type: string
      originalName:
        type: string
      size:
        type: integer
      status:
        type: string
      storedName:
        type: string
      updatedAt:
        type: string
      uploaderId:
        type: integer
      url:
        type: string
    type: object
  admin-server_internal_model.FolderTreeNode:
    properties:
      children:
        items:
          $ref: '#/definitions/admin-server_internal_model.FolderTreeNode'
        type: array
      id:
        type: integer
      name:
        type: string
      parentId:
        type: integer
    type: object
  admin-server_internal_model.LoginReq:
    properties:
      password:
        type: string
      username:
        type: string
    required:
    - password
    - username
    type: object
  admin-server_internal_model.LoginResp:
    properties:
      accessToken:
        type: string
      avatar:
        type: string
      expires:
        type: string
      nickname:
        type: string
      permissions:
        items:
          type: string
        type: array
      refreshToken:
        type: string
      roles:
        items:
          type: string
        type: array
      username:
        type: string
    type: object
  admin-server_internal_model.MergeFileReq:
    properties:
      fileId:
        type: string
      fileName:
        type: string
      folderId:
        type: integer
      mimeType:
        type: string
      totalChunks:
        minimum: 1
        type: integer
    required:
    - fileId
    - fileName
    - folderId
    - totalChunks
    type: object
  admin-server_internal_model.PageResult:
    properties:
      list: {}
      page:
        type: integer
      pageSize:
        type: integer
      total:
        type: integer
    type: object
  admin-server_internal_model.RegisterReq:
    properties:
      avatar:
        type: string
      nickname:
        type: string
      password:
        minLength: 6
        type: string
      phone:
        type: string
      username:
        maxLength: 50
        minLength: 3
        type: string
    required:
    - password
    - username
    type: object
  admin-server_internal_model.UpdateFolderReq:
    properties:
      name:
        type: string
      parentId:
        type: integer
    type: object
  admin-server_internal_model.UpdateUserReq:
    properties:
      avatar:
        type: string
      email:
        type: string
      nickname:
        type: string
      phone:
        type: string
      roles:
        type: string
      status:
        description: 用指针区分"未传"和"传了0（禁用）"
        type: integer
    type: object
  admin-server_internal_model.User:
    properties:
      avatar:
        type: string
      createdAt:
        type: string
      email:
        type: string
      id:
        type: integer
      nickname:
        type: string
      phone:
        type: string
      roles:
        type: string
      status:
        type: integer
      updatedAt:
        type: string
      username:
        type: string
    type: object
  internal_handler.ChunkStatusRespWrapper:
    properties:
      code:
        example: "00000"
        type: string
      data:
        $ref: '#/definitions/admin-server_internal_model.ChunkStatusResp'
      message:
        example: success
        type: string
    type: object
  internal_handler.ErrorRespWrapper:
    properties:
      code:
        example: A0400
        type: string
      data: {}
      message:
        type: string
    type: object
  internal_handler.FileRespWrapper:
    properties:
      code:
        example: "00000"
        type: string
      data:
        $ref: '#/definitions/admin-server_internal_model.FileRecord'
      message:
        example: success
        type: string
    type: object
  internal_handler.FolderRespWrapper:
    properties:
      code:
        example: "00000"
        type: string
      data:
        $ref: '#/definitions/admin-server_internal_model.FileFolder'
      message:
        example: success
        type: string
    type: object
  internal_handler.FolderTreeRespWrapper:
    properties:
      code:
        example: "00000"
        type: string
      data:
        items:
          $ref: '#/definitions/admin-server_internal_model.FolderTreeNode'
        type: array
      message:
        example: success
        type: string
    type: object
  internal_handler.LoginRespWrapper:
    properties:
      code:
        example: "00000"
        type: string
      data:
        $ref: '#/definitions/admin-server_internal_model.LoginResp'
      message:
        example: success
        type: string
    type: object
  internal_handler.MsgRespWrapper:
    properties:
      code:
        example: "00000"
        type: string
      data: {}
      message:
        example: 操作成功
        type: string
    type: object
  internal_handler.PageRespWrapper:
    properties:
      code:
        example: "00000"
        type: string
      data:
        $ref: '#/definitions/admin-server_internal_model.PageResult'
      message:
        example: success
        type: string
    type: object
  internal_handler.RegisterRespWrapper:
    properties:
      code:
        example: "00000"
        type: string
      data:
        properties:
          id:
            type: integer
          username:
            type: string
        type: object
      message:
        example: 注册成功
        type: string
    type: object
  internal_handler.UploadRespWrapper:
    properties:
      code:
        example: "00000"
        type: string
      data:
        properties:
          url:
            example: /uploads/avatars/xxx.png
            type: string
        type: object
      message:
        example: success
        type: string
    type: object
  internal_handler.UserRespWrapper:
    properties:
      code:
        example: "00000"
        type: string
      data:
        $ref: '#/definitions/admin-server_internal_model.User'
      message:
        example: success
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: 后台管理系统 API
  title: Admin Server API
  version: "1.0"
paths:
  /:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: 根路径
      tags:
      - 系统
  /api/auth/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: 登录参数
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/admin-server_internal_model.LoginReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler.LoginRespWrapper'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_handler.ErrorRespWrapper'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/internal_handler.ErrorRespWrapper'
      summary: 用户登录
      tags:
      - 认证
  /api/auth/register:
    post:
      consumes:
      - application/json
      parameters:
      - description: 注册参数
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/admin-server_internal_model.RegisterReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler.RegisterRespWrapper'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_handler.ErrorRespWrapper'
      summary: 用户注册
      tags:
      - 认证
  /api/files:
    get:
      parameters:
      - description: 文件夹ID
        in: query
        name: folderId
        required: true
        type: integer
      - description: 文件名关键词
        in: query
        name: keyword
        type: string
      - description: 页码
        in: query
        name: page
        type: integer
      - description: 每页数量
        in: query
        name: pageSize
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler.PageRespWrapper'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_handler.ErrorRespWrapper'
      security:
      - BearerAuth: []
      summary: 文件列表
      tags:
      - 文件管理
  /api/files/{id}:
    delete:
      parameters:
      - description: 文件ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler.MsgRespWrapper'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_handler.ErrorRespWrapper'
      security:
      - BearerAuth: []
      summary: 删除文件
      tags:
      - 文件管理
    get:
      parameters:
      - description: 文件ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler.FileRespWrapper'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_handler.ErrorRespWrapper'
      security:
      - BearerAuth: []
      summary: 文件详情
      tags:
      - 文件管理
  /api/files/{id}/download:
    get:
      parameters:
      - description: 文件ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/octet-stream
      responses:
        "200":
          description: OK
          schema:
            type: file
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_handler.ErrorRespWrapper'
      security:
      - BearerAuth: []
      summary: 文件下载
      tags:
      - 文件管理
  /api/files/{id}/preview:
    get:
      parameters:
      - description: 文件ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/octet-stream
      responses:
        "200":
          description: OK
          schema:
            type: file
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_handler.ErrorRespWrapper'
      security:
      - BearerAuth: []
      summary: 文件预览
      tags:
      - 文件管理
  /api/files/upload:
    post:
      consumes:
      - multipart/form-data
      parameters:
      - description: 文件
        in: formData
        name: file
        required: true
        type: file
      - description: 文件夹ID
        in: formData
        name: folderId
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler.FileRespWrapper'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_handler.ErrorRespWrapper'
      security:
      - BearerAuth: []
      summary: 普通文件上传
      tags:
      - 文件管理
  /api/files/upload/chunk:
    post:
      consumes:
      - multipart/form-data
      parameters:
      - description: 分片数据
        in: formData
        name: file
        required: true
        type: file
      - description: 上传会话ID
        in: formData
        name: fileId
        required: true
        type: string
      - description: 原始文件名
        in: formData
        name: fileName
        required: true
        type: string
      - description: 分片索引
        in: formData
        name: chunkIndex
        required: true
        type: integer
      - description: 总分片数
        in: formData
        name: totalChunks
        required: true
        type: integer
      - description: 文件夹ID
        in: formData
        name: folderId
        required: true
        type: integer
      - description: MIME类型
        in: formData
        name: mimeType
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler.MsgRespWrapper'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_handler.ErrorRespWrapper'
      security:
      - BearerAuth: []
      summary: 分片上传
      tags:
      - 文件管理
  /api/files/upload/chunk/status:
    get:
      parameters:
      - description: 上传会话ID
        in: query
        name: fileId
        required: true
        type: string
      - description: 总分片数
        in: query
        name: totalChunks
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler.ChunkStatusRespWrapper'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_handler.ErrorRespWrapper'
      security:
      - BearerAuth: []
      summary: 分片上传状态
      tags:
      - 文件管理
  /api/files/upload/merge:
    post:
      consumes:
      - application/json
      parameters:
      - description: 合并参数
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/admin-server_internal_model.MergeFileReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler.FileRespWrapper'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_handler.ErrorRespWrapper'
      security:
      - BearerAuth: []
      summary: 合并分片
      tags:
      - 文件管理
  /api/folders:
    post:
      consumes:
      - application/json
      parameters:
      - description: 创建参数
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/admin-server_internal_model.CreateFolderReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler.FolderRespWrapper'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_handler.ErrorRespWrapper'
      security:
      - BearerAuth: []
      summary: 创建文件夹
      tags:
      - 文件管理
  /api/folders/{id}:
    delete:
      parameters:
      - description: 文件夹ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler.MsgRespWrapper'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_handler.ErrorRespWrapper'
      security:
      - BearerAuth: []
      summary: 删除文件夹
      tags:
      - 文件管理
    put:
      consumes:
      - application/json
      parameters:
      - description: 文件夹ID
        in: path
        name: id
        required: true
        type: integer
      - description: 更新参数
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/admin-server_internal_model.UpdateFolderReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler.FolderRespWrapper'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_handler.ErrorRespWrapper'
      security:
      - BearerAuth: []
      summary: 更新文件夹
      tags:
      - 文件管理
  /api/folders/tree:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler.FolderTreeRespWrapper'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_handler.ErrorRespWrapper'
      security:
      - BearerAuth: []
      summary: 文件夹树
      tags:
      - 文件管理
  /api/upload/avatar:
    post:
      consumes:
      - multipart/form-data
      parameters:
      - description: 头像文件
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler.UploadRespWrapper'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_handler.ErrorRespWrapper'
      security:
      - BearerAuth: []
      summary: 上传头像
      tags:
      - 文件上传
  /api/users:
    get:
      parameters:
      - description: 页码
        in: query
        name: page
        type: integer
      - description: 每页数量
        in: query
        name: pageSize
        type: integer
      - description: 用户名筛选
        in: query
        name: username
        type: string
      - description: 状态筛选
        in: query
        name: status
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler.PageRespWrapper'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_handler.ErrorRespWrapper'
      security:
      - BearerAuth: []
      summary: 用户列表
      tags:
      - 用户管理
    post:
      consumes:
      - application/json
      parameters:
      - description: 创建参数
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/admin-server_internal_model.CreateUserReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler.UserRespWrapper'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_handler.ErrorRespWrapper'
      security:
      - BearerAuth: []
      summary: 创建用户
      tags:
      - 用户管理
  /api/users/{id}:
    delete:
      parameters:
      - description: 用户 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler.MsgRespWrapper'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_handler.ErrorRespWrapper'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_handler.ErrorRespWrapper'
      security:
      - BearerAuth: []
      summary: 删除用户
      tags:
      - 用户管理
    get:
      parameters:
      - description: 用户 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler.UserRespWrapper'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_handler.ErrorRespWrapper'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_handler.ErrorRespWrapper'
      security:
      - BearerAuth: []
      summary: 查询用户详情
      tags:
      - 用户管理
    put:
      consumes:
      - application/json
      parameters:
      - description: 用户 ID
        in: path
        name: id
        required: true
        type: integer
      - description: 更新参数
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/admin-server_internal_model.UpdateUserReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler.UserRespWrapper'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_handler.ErrorRespWrapper'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_handler.ErrorRespWrapper'
      security:
      - BearerAuth: []
      summary: 更新用户
      tags:
      - 用户管理
  /health:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: 健康检查
      tags:
      - 系统
securityDefinitions:
  BearerAuth:
    description: '格式: Bearer {accessToken}'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
